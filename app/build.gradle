plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
}

// Fixed signing key: ONE keystore for every Muse build, stored OUTSIDE the
// repo at ~/workspace/wprd-release.keystore (passwords in
// ~/workspace/wprd-keystore.properties, also outside the repo, never
// committed). Because every APK is signed with this same key, each new
// build installs as an update over the previous one. The config is only
// applied when the keystore files exist, so CI builds (GitHub Actions,
// which do not have the keystore) still work with the default debug key.
def wprdKsProps = new Properties()
def wprdKsPropsFile = file("${rootDir}/../wprd-keystore.properties")
def wprdKsFile = file("${rootDir}/../wprd-release.keystore")
if (wprdKsPropsFile.exists()) {
    wprdKsProps.load(new FileInputStream(wprdKsPropsFile))
}
ext.wprdSigningReady = wprdKsPropsFile.exists() && wprdKsFile.exists()

android {
    namespace 'com.wprd.calling'
    compileSdk 34

    defaultConfig {
        applicationId "com.wprd.calling"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        wprd {
            storeFile wprdKsFile
            storePassword wprdKsProps['storePassword']
            keyAlias wprdKsProps['keyAlias'] ?: 'wprd'
            keyPassword wprdKsProps['keyPassword']
        }
    }

    buildTypes {
        release {
            // Minify kept OFF for now: R8 adds risk around WebRTC/Firebase
            // reflection and no size pressure exists yet. Signed release
            // build with the fixed WPRD key (see signingConfigs above).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (wprdSigningReady) {
                signingConfig signingConfigs.wprd
            }
        }
        debug {
            minifyEnabled false
            // Same fixed key for debug too, so ANY Muse-built APK (debug or
            // release) updates over any other without uninstalling.
            if (wprdSigningReady) {
                signingConfig signingConfigs.wprd
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // UpdateChecker reads BuildConfig.VERSION_NAME for the
        // GitHub-release version comparison.
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Native WebRTC Engine
    implementation 'io.getstream:stream-webrtc-android:1.1.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Room Local SQLite DB
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Coroutines & Coil Image Loader
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'io.coil-kt:coil:2.6.0'
}
