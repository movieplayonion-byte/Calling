name: Emulator Smoke Test

on:
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Run app on Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: Nexus 6
        disable-animations: true
        script: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.wprd.calling/.ui.splash.SplashActivity || true
          sleep 15
          adb exec-out screencap -p > emulator-screenshot.png
          adb logcat -d > logcat.txt
          adb shell pidof com.wprd.calling || echo "APP_PROCESS_NOT_RUNNING"

    - name: Upload screenshot and logcat
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-test-results
        path: |
          emulator-screenshot.png
          logcat.txt
